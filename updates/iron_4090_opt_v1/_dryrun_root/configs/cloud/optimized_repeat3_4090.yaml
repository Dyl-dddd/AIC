# Controlled optimization A: only rare-class sampling changes from the stock recipe.
train:
  data: data/official_yolo_hybrid_v2/steel_defect_repeat3.yaml
  model: yolo11s.pt
  pretrained: none
  loss: bce
  project: runs/cloud4090_opt
  name: opt_repeat3
  epochs: 5
  imgsz: 1024
  batch: 2
  nbs: 16
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.1
  warmup_epochs: 0.5
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  patience: 0
  mosaic: 0.0
  mixup: 0.0
  close_mosaic: 0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.1
  erasing: 0.0
  cache: false
  amp: false
  freeze_bn: false
  defer_validation: true
  val: true
  plots: false
  save_period: 1
  seed: 42
  exist_ok: false
