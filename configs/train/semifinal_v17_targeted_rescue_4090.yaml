# V17: short complementary proposal expert for classes highlighted by V16 miss audit.
train:
  data: data/semifinal_yolo_targeted_v17/steel_defect.yaml
  model: yolo11m.pt
  pretrained: none
  loss: bce
  project: runs/semifinal
  name: v17_targeted_rescue
  epochs: 8
  imgsz: 1280
  batch: 6
  nbs: 64
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.000012
  lrf: 0.10
  warmup_epochs: 0.5
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  box: 10.0
  cls: 0.8
  dfl: 2.0
  patience: 0
  mosaic: 0.05
  mixup: 0.0
  close_mosaic: 2
  degrees: 0.0
  translate: 0.015
  scale: 0.06
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.08
  erasing: 0.0
  cache: false
  amp: true
  deterministic: true
  freeze_bn: false
  val: false
  defer_validation: true
  plots: false
  save_period: 4
  seed: 20261002
  exist_ok: true
