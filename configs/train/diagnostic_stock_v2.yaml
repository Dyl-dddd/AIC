# Intentional train=self-eval learning diagnostic. Never report as generalization.
train:
  data: data/diagnostic_v2/diagnostic.yaml
  model: yolo11s.pt
  pretrained: none
  loss: bce
  project: runs/diagnostic_v2
  name: R002_stock_bce
  epochs: 40
  imgsz: 1024
  batch: 2
  nbs: 2
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.1
  warmup_epochs: 0.0
  cos_lr: true
  weight_decay: 0.0005
  patience: 0
  mosaic: 0.0
  mixup: 0.0
  close_mosaic: 0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  fliplr: 0.0
  flipud: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  erasing: 0.0
  cache: false
  amp: true
  val: true
  plots: false
  save_period: 10
  seed: 42
  exist_ok: false
