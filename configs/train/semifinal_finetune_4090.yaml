# Low-memory fine-tuning from the strongest preliminary-stage checkpoint.
train:
  data: data/semifinal_yolo_grid_v1/steel_defect.yaml
  # Put the downloaded epoch25 checkpoint at the project root, or override
  # this value with: --model /absolute/path/to/checkpoint.pt
  model: best_score_proxy_epoch25.pt
  pretrained: none
  loss: bce
  project: runs/semifinal
  name: grid2x3_ft30_b2
  epochs: 30
  imgsz: 1024
  batch: 2
  nbs: 16
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.1
  warmup_epochs: 0.5
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  patience: 0
  mosaic: 0.0
  mixup: 0.0
  close_mosaic: 0
  degrees: 0.0
  translate: 0.02
  scale: 0.05
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.15
  erasing: 0.0
  cache: false
  amp: true
  freeze_bn: false
  val: false
  defer_validation: true
  plots: false
  save_period: 5
  seed: 42
  exist_ok: false
