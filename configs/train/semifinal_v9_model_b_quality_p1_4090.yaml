# V9 arm 1: medium-model quality refinement with stronger box/DFL supervision.
train:
  data: data/semifinal_yolo_balanced_v3/steel_defect.yaml
  model: yolo11m.pt
  pretrained: none
  loss: varifocal
  varifocal_gamma: 2.0
  varifocal_alpha: 0.75
  quality_power: 1.0
  project: runs/semifinal
  name: v9_model_b_quality_p1
  epochs: 10
  imgsz: 1280
  batch: 4
  nbs: 64
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.00001
  lrf: 0.10
  warmup_epochs: 0.5
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  box: 10.0
  cls: 0.5
  dfl: 2.0
  patience: 0
  mosaic: 0.0
  mixup: 0.0
  close_mosaic: 0
  degrees: 0.0
  translate: 0.01
  scale: 0.03
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.08
  erasing: 0.0
  cache: false
  amp: true
  deterministic: true
  freeze_bn: false
  val: false
  defer_validation: true
  plots: false
  save_period: 5
  seed: 20260930
  exist_ok: true
