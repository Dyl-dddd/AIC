# V13 arm A: high-resolution recall expert with bounded spatial augmentation.
train:
  data: data/semifinal_yolo_balanced_v3/steel_defect.yaml
  model: yolo11m.pt
  pretrained: none
  loss: bce
  project: runs/semifinal
  name: v13_hires_recall_bce
  epochs: 12
  imgsz: 1536
  batch: 4
  nbs: 64
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.000015
  lrf: 0.15
  warmup_epochs: 0.5
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  box: 8.5
  cls: 0.8
  dfl: 1.5
  patience: 0
  mosaic: 0.20
  mixup: 0.0
  close_mosaic: 3
  degrees: 0.0
  translate: 0.03
  scale: 0.12
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.10
  erasing: 0.0
  cache: false
  amp: true
  deterministic: true
  freeze_bn: false
  val: false
  defer_validation: true
  plots: false
  save_period: 4
  seed: 20261001
  exist_ok: true
