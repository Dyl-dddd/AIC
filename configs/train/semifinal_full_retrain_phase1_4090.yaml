# Clean full-network retraining from the public YOLO11s checkpoint.
train:
  data: data/semifinal_yolo_balanced_v3/steel_defect.yaml
  model: yolo11s.pt
  pretrained: none
  loss: bce
  project: runs/semifinal
  name: full_retrain_v3_fix1_phase1
  epochs: 50
  imgsz: 1024
  batch: 8
  nbs: 64
  # workers>0 uses multiprocessing shared memory and caused a DataLoader Bus error
  # in the competition container. 0 keeps loading in the trainer process.
  workers: 0
  device: '0'
  optimizer: AdamW
  lr0: 0.0003
  lrf: 0.05
  warmup_epochs: 2.0
  warmup_bias_lr: 0.0
  cos_lr: true
  weight_decay: 0.0005
  patience: 0
  mosaic: 0.15
  mixup: 0.0
  close_mosaic: 10
  degrees: 0.0
  translate: 0.03
  scale: 0.10
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.18
  erasing: 0.0
  cache: false
  amp: true
  freeze_bn: false
  val: false
  defer_validation: true
  plots: false
  save_period: 10
  seed: 42
  exist_ok: true

