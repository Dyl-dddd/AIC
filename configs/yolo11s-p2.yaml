# YOLO11s with an additional P2/4 detection head for tiny industrial defects.
nc: 9
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]               # 1 P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]        # 2 P2/4
  - [-1, 1, Conv, [256, 3, 2]]               # 3 P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]        # 4 P3/8
  - [-1, 1, Conv, [512, 3, 2]]               # 5 P4/16
  - [-1, 2, C3k2, [512, true]]               # 6 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]              # 7 P5/32
  - [-1, 2, C3k2, [1024, true]]              # 8
  - [-1, 1, SPPF, [1024, 5]]                 # 9
  - [-1, 2, C2PSA, [1024]]                   # 10 global context

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 11
  - [[-1, 6], 1, Concat, [1]]                # 12
  - [-1, 2, C3k2, [512, false]]              # 13

  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 14
  - [[-1, 4], 1, Concat, [1]]                # 15
  - [-1, 2, C3k2, [256, false]]              # 16 P3

  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 17
  - [[-1, 2], 1, Concat, [1]]                # 18
  - [-1, 2, C3k2, [128, false]]              # 19 P2 tiny

  - [-1, 1, Conv, [128, 3, 2]]               # 20
  - [[-1, 16], 1, Concat, [1]]               # 21
  - [-1, 2, C3k2, [256, false]]              # 22 P3 small

  - [-1, 1, Conv, [256, 3, 2]]               # 23
  - [[-1, 13], 1, Concat, [1]]               # 24
  - [-1, 2, C3k2, [512, false]]              # 25 P4 medium

  - [-1, 1, Conv, [512, 3, 2]]               # 26
  - [[-1, 10], 1, Concat, [1]]               # 27
  - [-1, 2, C3k2, [1024, true]]              # 28 P5 large

  - [[19, 22, 25, 28], 1, Detect, [nc]]
