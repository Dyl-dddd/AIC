# Candidate profile only. Keep a component only after original-image ablation.
prepare:
  source: /workspace/data/official/train
  output: /workspace/data/official_yolo_candidate
  classes: official
  tile_size: 1024
  overlap: 0.25
  val_ratio: 0.15
  calibration_ratio: 0.10
  split_trials: 4000
  negative_ratio: 0.25
  rare_repeat_cap: 3.0
  min_visibility: 0.35
  seed: 42
  workers: 8
  deblur: true
  deblur_threshold: 85.0
  clahe: false
  view_mode: both
  global_size: 1024
